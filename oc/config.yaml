name: OC Stack
version: "2.0.1"
slug: oc
description: The ai-bundle OC stack as one HAOS add-on — Ollama cloud relays (11434/11435), OpenClaw gateway, Caddy reverse proxy, the Claude Code sandbox (ttyd :7681) and the warm Chromium scraper (CDP :9222, noVNC :8300).
arch:
  - amd64
startup: services
boot: auto
webui: http://[HOST]:[PORT:7681]
map:
  - 'share:rw'
ports:
  7681/tcp: 7681
  8127/tcp: 8127
  11434/tcp: 11434
  11435/tcp: 11435
  9222/tcp: 9222
  8300/tcp: 8300
options:
  sandbox_enabled: false
  chromium_enabled: true
  openclaw_enabled: false
  side_by_side: false
  novnc_password: changeme123
schema:
  sandbox_enabled: bool
  chromium_enabled: bool
  openclaw_enabled: bool
  side_by_side: bool
  novnc_password: str?
host_network: false
hassio_api: false
homeassistant_api: false
full_access: false
privileged: []
apparmor: true
devices: []
usb: false
uart: false
stage: stable